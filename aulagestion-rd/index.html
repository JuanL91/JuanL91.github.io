<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>AulaGestión RD</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:24px;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06)}.spinner{width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{font-size:14px;color:#64748b;line-height:1.5}.err{color:#b91c1c}.small{font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="box"><div class="spinner"></div><strong>Cargando AulaGestión RD…</strong><p id="status">Preparando la aplicación.</p><p class="small">Versión web · GitHub Pages · V5 exacta</p></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   const files=['app/pair0.txt','app/pair1.txt','app/pair2.txt','app/c06.txt','app/c07.txt','app/c08.txt','app/c09.txt','app/c10.txt','app/c11.txt','app/c12.txt','app/c13.txt'];
   const parts=[];
   for(let i=0;i<files.length;i++){
     status.textContent=`Cargando componente ${i+1} de ${files.length}…`;
     const r=await fetch(files[i]+'?v=v5-exact-1',{cache:'no-store'});
     if(!r.ok) throw new Error(`${files[i]}: HTTP ${r.status}`);
     parts.push(await r.text());
   }
   status.textContent='Verificando y abriendo…';
   const b64=parts.join('').replace(/\s+/g,'');
   if(b64.length!==53288) throw new Error(`Paquete incompleto (${b64.length}/53288).`);
   if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) throw new Error('Paquete con caracteres no válidos.');
   const bin=atob(b64);
   if(bin.length!==39965) throw new Error(`Tamaño comprimido inesperado (${bin.length}/39965).`);
   const bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
   if(!('DecompressionStream' in window)) throw new Error('Usa una versión actual de Chrome o Edge.');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   const utf8len=new TextEncoder().encode(html).length;
   if(utf8len!==181377) throw new Error(`Aplicación incompleta (${utf8len}/181377 bytes).`);
   if(!html.includes('AulaGestión RD')||!html.includes('IndexedDB')) throw new Error('La aplicación no superó la validación.');
   document.open();document.write(html);document.close();
 }catch(e){
   document.querySelector('.spinner')?.remove();
   status.className='err';
   status.textContent='No se pudo cargar AulaGestión. '+e.message;
 }
})();
</script>
</body>
</html>
