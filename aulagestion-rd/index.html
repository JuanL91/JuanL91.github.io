<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>AulaGestión RD</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;display:grid;place-items:center;min-height:100vh}
    .box{max-width:460px;margin:24px;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    .spinner{width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    p{font-size:14px;color:#64748b;line-height:1.5}
    .err{color:#b91c1c}
  </style>
</head>
<body>
  <div class="box"><div class="spinner"></div><strong>Cargando AulaGestión RD…</strong><p id="status">Preparando la aplicación.</p></div>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    const parts=[
      'parts/index.part01.b64','parts/index.part02.b64','parts/index.part03.b64','parts/index.part04.b64',
      'parts/index.part05.b64','parts/index.part06.b64','parts/index.part07.b64','parts/index.part08.b64'
    ];
    try{
      const texts=[];
      for(let i=0;i<parts.length;i++){
        status.textContent=`Cargando componente ${i+1} de ${parts.length}…`;
        const r=await fetch(parts[i],{cache:'no-cache'});
        if(!r.ok) throw new Error(`No se pudo cargar ${parts[i]} (${r.status}).`);
        texts.push((await r.text()).trim());
      }
      const byteChunks=texts.map(t=>{
        const bin=atob(t); const a=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
        return a;
      });
      const total=byteChunks.reduce((n,a)=>n+a.length,0);
      const bytes=new Uint8Array(total); let off=0;
      for(const a of byteChunks){bytes.set(a,off);off+=a.length;}
      const html=new TextDecoder('utf-8').decode(bytes);
      document.open(); document.write(html); document.close();
    }catch(e){
      document.querySelector('.spinner')?.remove();
      status.className='err';
      status.textContent='No se pudo cargar AulaGestión. Verifica tu conexión y recarga la página. '+e.message;
    }
  })();
  </script>
</body>
</html>
